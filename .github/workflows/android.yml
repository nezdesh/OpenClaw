name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir build
          cd build
          cmake ..
          make
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Android
          path: build/*.apk
